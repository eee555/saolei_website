# etc/nginx/conf.d

# ---------------------------------------------------------------------------
# CORS (production). Django's corsheaders is only enabled when DEBUG is on.
# To let another website read the public endpoints from the browser, add one
# line to $cors_origin_allowed below. The origin has no path or trailing slash.
# CORS only restricts scripts running on other websites; curl, bots and other
# non-browser clients are not affected.
# ---------------------------------------------------------------------------
map_hash_bucket_size 128;

map $http_origin $cors_origin_allowed {
    default 0;
    "https://strange-dust.github.io" 1;
}

# Public endpoints that may be read cross-origin ($uri has no query string).
# /internal-media/ is the X-Accel-Redirect target of replay and avatar responses.
map $uri $cors_public_path {
    default 0;
    ~^/api/userprofile/avatar/ 1;
    ~^/api/userprofile/identifier/?$ 1;
    ~^/api/userprofile/info/ 1;
    ~^/api/userprofile/infobulk/?$ 1;
    ~^/api/userprofile/infoupdated/?$ 1;
    ~^/api/userprofile/videolist/?$ 1;
    ~^/api/video/download/[0-9]+/?$ 1;
    ~^/api/video/preview/?$ 1;
    ~^/api/video/infobulk/?$ 1;
    ~^/api/video/detailbulk/?$ 1;
    ~^/internal-media/ 1;
}

# Empty value makes add_header skip the header.
map "$cors_public_path$cors_origin_allowed" $cors_allow_origin {
    default "";
    "11" $http_origin;
}

map "$request_method$cors_public_path$cors_origin_allowed" $cors_preflight {
    default 0;
    "OPTIONS11" 1;
}

# add_header is not allowed in a server-level "if", so the preflight-only headers
# are set at server level from these variables, which are empty for other requests.
map $cors_preflight $cors_preflight_methods {
    default "";
    1 "GET, OPTIONS";
}

map $cors_preflight $cors_preflight_headers {
    default "";
    1 "accept, content-type, range, user-agent";
}

map $cors_preflight $cors_preflight_max_age {
    default "";
    1 86400;
}

server {
    listen       80;
    # 修改1：
    # 配置为你自己服务器的ip地址
    server_name  openms.top;

    # 给acme放行
    location ~ "^/\.well-known/acme-challenge/([-_a-zA-Z0-9]+)$" {
      default_type text/plain;
      return 200 "xxx";
    }
    location  / {
      rewrite ^(.*)$ https://${server_name}$1 permanent;
    }

}

server {
    listen 443 ssl;
    server_name  openms.top;
    ssl_certificate     /etc/nginx/conf.d/cert.pem;
    ssl_certificate_key /etc/nginx/conf.d/key.pem;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # front_end/vite.config.ts uses Vite's default base "/".
    # Build assets are requested as /assets/..., and vite-plugin-compression
    # writes .gz files next to .js/.mjs/.json/.css/.html/.wasm in dist.
    gzip_static on;
    gzip_vary on;

    # Inherited by every location below that defines no add_header of its own.
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Expose-Headers Content-Disposition always;
    add_header Vary Origin always;
    # Empty outside preflight responses, so they are skipped.
    add_header Access-Control-Allow-Methods $cors_preflight_methods always;
    add_header Access-Control-Allow-Headers $cors_preflight_headers always;
    add_header Access-Control-Max-Age $cors_preflight_max_age always;

    # Django must not add its own CORS headers; nginx is the only source in production.
    uwsgi_hide_header Access-Control-Allow-Origin;
    uwsgi_hide_header Access-Control-Allow-Credentials;
    uwsgi_hide_header Access-Control-Expose-Headers;

    if ($cors_preflight) {
        return 204;
    }

    # VitePress 用户指南
    # 将 vitepress_doc/.vitepress/dist 的构建产物部署到 /root/saolei/docs/
    location ^~ /docs/ {
        alias /root/saolei/docs/;
        index index.html;
        try_files $uri $uri.html $uri/ /docs/index.html;
    }

    location ^~ /api/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    # MSGames synchronously reads external histories and imports replay files.
    # Keep this above the uWSGI per-request 90s limit and below the client's 120s timeout.
    location ^~ /api/accountlink/msgames/ {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_connect_timeout 5s;
        uwsgi_read_timeout 95s;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    location ^~ /api/userprofile/info/ {
        limit_req zone=general burst=5;
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    location ^~ /api/userprofile/avatar/ {
        limit_req zone=general burst=5;
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8000;
        uwsgi_read_timeout 2;
    }

    # Internal media target for X-Accel-Redirect responses.
    # Django resolves database ids to stored media paths; Nginx handles file lookup and transfer.
    # No add_header here: it would replace the server-level CORS headers.
    location ^~ /internal-media/ {
        internal;
        alias /root/saolei/media/;
    }
	
	# 修改3：
	# 当访问路径为/static时Nginx将会自行处理
    # 这里的/root/saolei_static/static路径为静态资源存储地址
    # 注意：该路径与前面Django的settings.py文件里设置的一致
    location ^~ /static/ {
        expires 30d;
        autoindex on;
        add_header Cache-Control private;
        alias /root/saolei/static/;
    }

    # 下载阿比特和元扫雷等
    location /download {
        expires 30d;
        autoindex on;
        add_header Cache-Control private;
        alias /root/saolei/download;
    }

    # 确保把wasm当作静态资源
    location ~* \.(html|css|gif|ico|jpg|js|json|mjs|png|ttf|woff|wasm|svg)$ {
        root /root/saolei/static;
    }
}


