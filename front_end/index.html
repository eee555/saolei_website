  <script>
    // Runs before the app module. The site needs Array.prototype.toReversed and
    // Promise.withResolvers; missing APIs throw during startup and otherwise leave
    // the indeterminate "1/3 Loading resources" screen.
    (function () {
      function textOf(value) {
        if (!value) return '';
        if (typeof value === 'string') return value;
        var message = typeof value.message === 'string' ? value.message : '';
        var stack = typeof value.stack === 'string' ? value.stack : '';
        return message || stack ? message + '\n' + stack : String(value);
      }

      function isSupportedBrowser() {
        return typeof Array.prototype.toReversed === 'function'
          && typeof Promise.withResolvers === 'function';
      }

      function isUnsupportedBrowserError(value) {
        var text = textOf(value);
        if (text.indexOf('is not a function') === -1) return false;
        return text.indexOf('toReversed') !== -1 || text.indexOf('withResolvers') !== -1;
      }

      function markOutdatedBrowser() {
        var root = document.documentElement;
        if (root.className.indexOf('outdated-browser') === -1) {
          root.className += (root.className ? ' ' : '') + 'outdated-browser';
        }
        var label = document.getElementById('startup-loading-label');
        if (label) label.setAttribute('role', 'alert');
        var progress = document.querySelector('#startup-loading progress');
        if (progress) progress.setAttribute('hidden', '');
      }

      window.addEventListener('error', function (event) {
        if (isUnsupportedBrowserError(event.message) || isUnsupportedBrowserError(event.error)) markOutdatedBrowser();
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (isUnsupportedBrowserError(event.reason)) markOutdatedBrowser();
      });
      document.addEventListener('DOMContentLoaded', function () {
        if (document.documentElement.className.indexOf('outdated-browser') !== -1) markOutdatedBrowser();
      });

      if (!isSupportedBrowser()) markOutdatedBrowser();
    })();
  </script>
  <style>
    .startup-outdated {
        display: none;
    }

    html.outdated-browser .startup-loading-status,
    html.outdated-browser #startup-loading-resource-status,
    html.outdated-browser #startup-loading progress {
        display: none;
    }

    html.outdated-browser .startup-outdated {
        display: block;
    }
  </style>
